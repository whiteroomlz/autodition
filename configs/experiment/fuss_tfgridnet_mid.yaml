# @package _global_

defaults:
  - override /data: fuss_separation
  - override /model: fuss_tfgridnet_mid
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

tags: ["audio", "fuss", "source-separation", "tfgridnet", "mid"]

seed: 12345

data:
  train_batch_size: 2
  val_batch_size: 2
  test_batch_size: 2

trainer:
  max_epochs: 120
  gradient_clip_val: 1.0

logger:
  mlflow:
    run_name: fuss_tfgridnet_mid
