# @package _global_

defaults:
  - override /data: fruletov_ast
  - override /model: fruletov_ast_base
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

tags: ["audio", "fruletov", "ast", "finetune"]

seed: 12345

trainer:
  max_epochs: 25
  gradient_clip_val: 1.0

logger:
  mlflow:
    run_name: fruletov_ast_finetune
