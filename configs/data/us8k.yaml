defaults:
  - feature_schema: us8k.yaml
  - target_schema: us8k.yaml
  - raw_data: us8k.yaml
  - collator: dynamic_collator.yaml
  - _self_

_target_: src.data.datamodule.AudioDataModule

audio_path_key: audio_path
audio_root_dir: ${paths.raw_data_dir}/UrbanSound8K
target_sr: 16000
clip_duration_seconds: null
return_waveform_in_sample: false

mel_spectrogram_cfg:
  _recursive_: false
  _target_: src.utils.instantiators.skip_insantiation_helper
  obj:
    _target_: src.data.components.preprocessing.audio.MelSpectrogram
    sample_rate: ${data.target_sr}
    n_mels: 128
    n_fft: 1024
    hop_length: 512
    f_min: 0.0
    f_max: null

