defaults:
  - schema: fruletov_spectrogram.yaml
  - raw_data: fruletov.yaml
  - collator: schema_collator.yaml
  - _self_

_target_: src.data.datamodule.AudioDataModule

audio_path_key: audio_path
audio_root_dir: ${paths.preprocessed_data_dir}/fruletov
target_sr: 16000
clip_duration_seconds: 10.0
waveform_field_name: null
spectrogram_field_name: mel_spectrogram

mel_spectrogram_cfg:
  _recursive_: false
  _target_: src.utils.instantiators.skip_insantiation_helper
  obj:
    _target_: src.data.components.preprocessing.audio.MelSpectrogram
    sample_rate: ${data.target_sr}
    n_mels: 128
    n_fft: 1024
    hop_length: 512
    f_min: 0.0
    f_max: null

train_batch_size: 32
val_batch_size: 64
test_batch_size: 64
num_workers: 8
pin_memory: True
prefetch_factor: null
persistent_workers: false
use_train_balance_sampler: false
balance_on_field: null
