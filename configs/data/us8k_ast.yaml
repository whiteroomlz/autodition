defaults:
  - feature_schema: us8k_waveform.yaml
  - target_schema: us8k.yaml
  - raw_data: us8k.yaml
  - collator: dynamic_collator.yaml
  - _self_

_target_: src.data.datamodule.AudioDataModule

audio_path_key: audio_path
audio_root_dir: ${paths.raw_data_dir}/UrbanSound8K
target_sr: 16000
clip_duration_seconds: null
return_waveform_in_sample: true
mel_spectrogram_cfg: null

train_batch_size: 8
val_batch_size: 8
test_batch_size: 8
num_workers: 8
pin_memory: True
prefetch_factor: null
persistent_workers: false
use_train_balance_sampler: false
