defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: ${model.monitor_metric}
  mode: "max"
  save_last: True
  save_top_k: 1
  auto_insert_metric_name: False

early_stopping:
  monitor: ${model.monitor_metric}
  patience: 5
  mode: "max"

model_summary:
  max_depth: -1
