[project]
name = "autodition"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10,<3.12.9"
dependencies = [
    # --------- pytorch --------- #
    "torch>=2.5",
    "torchaudio>=2.5",
    "pytorch-lightning>=2.4",
    "torchmetrics>=1.6",

    # --------- hydra --------- #
    "hydra-core>=1.3",
    "hydra-colorlog>=1.2",
    "hydra-optuna-sweeper>=1.2",

    # --------- loggers --------- #
    "wandb>=0.18",
    "mlflow>=2.18",

    # --------- audio --------- #
    "librosa>=0.10",
    "soundfile>=0.12",
    "torchcodec>=0.1",

    # --------- data --------- #
    "numpy>=1.26",
    "pandas>=2.2",

    # --------- dvc --------- #
    "dvc>=3.56",
    "dvc-s3>=3.2",

    # --------- others --------- #
    "rootutils>=1.0",
    "rich>=13.9",
    "omegaconf>=2.3",
    "einops>=0.8",
    "scikit-learn>=1.5",
    "transformers>=4.57",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "ipython>=8.29",
    "notebook>=7.3",
    "nbstripout>=0.8",
    "datasets>=3.0",
    "kaggle>=1.7",
    "commitizen>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F401", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--durations=0",
    "--strict-markers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
log_cli = "True"
markers = [
    "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
