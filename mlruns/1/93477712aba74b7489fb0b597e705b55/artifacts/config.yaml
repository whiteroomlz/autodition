        _target_: src.utils.utils.torch_dtype
        dtype: long
      vocabularies_size:
      - 10
      embeddings_dim:
      - 10
  raw_data:
    _target_: src.data.datamodule.RawData
    _recursive_: false
    dataset_dir: /home/whiteroomlz/repos/autodition/data/preprocessed//urbansound8k/
    feature_data_cfg:
      _target_: src.data.components.raw_data.PickleReader
      data_source: /home/whiteroomlz/repos/autodition/data/preprocessed//urbansound8k/features.pkl
    target_data_cfg:
      _target_: src.data.components.raw_data.PickleReader
      data_source: /home/whiteroomlz/repos/autodition/data/preprocessed//urbansound8k/targets.pkl
    train_keys_cfg:
      _target_: src.data.components.raw_data.PickleReader
      data_source: /home/whiteroomlz/repos/autodition/data/preprocessed//urbansound8k/train_keys.pkl
    val_keys_cfg:
      _target_: src.data.components.raw_data.PickleReader
      data_source: /home/whiteroomlz/repos/autodition/data/preprocessed//urbansound8k/val_keys.pkl
    test_keys_cfg:
      _target_: src.data.components.raw_data.PickleReader
      data_source: /home/whiteroomlz/repos/autodition/data/preprocessed//urbansound8k/test_keys.pkl
  collator:
    _target_: src.data.components.collate.DynamicLengthCollator
    feature_schema:
      _target_: src.data.components.containers.FeatureSchema
      numerical:
        _target_: src.data.components.containers.NumericalFeatureInfo
        feature_names:
        - mel_spectrogram
        torch_dtype:
          _target_: src.utils.utils.torch_dtype
          dtype: float32
    target_schema:
      _target_: src.data.components.containers.TargetSchema
      categorical:
        _target_: src.data.components.containers.CategoricalFeatureInfo
        feature_names:
        - class_id
        torch_dtype:
          _target_: src.utils.utils.torch_dtype
          dtype: long
        vocabularies_size:
        - 10
        embeddings_dim:
        - 10
  _target_: src.data.datamodule.AudioDataModule
  audio_path_key: audio_path
  target_sr: 16000
  mel_spectrogram_cfg:
    _recursive_: false
    _target_: src.utils.instantiators.skip_insantiation_helper
    obj:
      _target_: src.data.components.preprocessing.audio.MelSpectrogram
      sample_rate: 16000
      n_mels: 128
      n_fft: 1024
      hop_length: 512
      f_min: 0.0
      f_max: null
  train_batch_size: 32
  val_batch_size: 32
  test_batch_size: 32
  num_workers: 8
  pin_memory: true
  prefetch_factor: null
  persistent_workers: false
  use_train_balance_sampler: false
model:
  _target_: src.models.audio_classification_module.AudioClassificationModule
  num_classes: 10
  target_name: class_id
  compile: false
  monitor_metric: val/acc
  warmup_type: null
  warmup_rate: null
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    weight_decay: 1.0e-05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: 50
    eta_min: 1.0e-06
  net:
    _target_: src.models.components.base.Model
    input_block:
      _target_: src.models.components.input_blocks.passthrough.SequentialNumericalPassthrough
    hidden_blocks:
    - _target_: src.models.components.hidden_blocks.sequential_pooling.Pooling
      emb_dim: 128
    output_block:
      _target_: src.models.components.output_blocks.classifiers.flat_linear.FlatLinearClassifier
      emb_dim: 384
      n_layers: 2
      dropout: 0.1
      activation: gelu
      num_classes: 10
